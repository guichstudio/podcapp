# Generated project: edit this file, then `xcodegen generate --spec project.yml`.
# Generate with XcodeGen 2.42.x. From 2.44 it writes project format 77, which
# only Xcode 16+ can open, and this Mac still runs Xcode 15.4. Once it runs
# Xcode 26 (required for any TestFlight upload), any version will do.
name: Podcapp
options:
  bundleIdPrefix: com.louisguichard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "19"
    SWIFT_VERSION: "5.9"
    # Louis's personal team. Kept here rather than only in the generated project,
    # which XcodeGen overwrites every time the spec is regenerated.
    DEVELOPMENT_TEAM: V7BMDJS5C7
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Podcapp:
    type: application
    platform: iOS
    sources:
      - path: Podcapp
    # UIAppFonts is an array, and INFOPLIST_KEY_* build settings only carry
    # scalars, so the app target needs a real plist. Xcode still merges the
    # generated keys below into it.
    info:
      path: Podcapp/Info.plist
      properties:
        UIAppFonts:
          - InterTight-Light.ttf
          - InterTight-Regular.ttf
          - InterTight-SemiBold.ttf
        # XcodeGen would otherwise hardcode 1.0 (1) here and only the build
        # settings would carry the truth. TestFlight refuses a build number it
        # has already seen, so the two must not be able to drift.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # HTTPS only, which is exempt: answering here means App Store Connect
        # never stops an upload to ask the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisguichard.podcapp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Podcapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: Podcapp/Podcapp.entitlements
    dependencies:
      - target: ShareExtension
        embed: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Podcapp/Shared.swift
      - path: Podcapp/Feedback.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Podcapp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisguichard.podcapp.share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
