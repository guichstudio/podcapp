# Generated project: edit this file, then `xcodegen generate --spec project.yml`.
# Any XcodeGen version does now. The 2.42 pin existed because newer releases
# write project format 77, unreadable by Xcode 15.4; this Mac runs Xcode 26
# since 2026-09-01.
name: Podcapp
options:
  bundleIdPrefix: com.louisguichard
  # English is the source language: every Text("...") in the code IS the English
  # string, and fr.lproj maps it to French. The phone decides which one shows.
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "30"
    SWIFT_VERSION: "5.9"
    # Louis's personal team. Kept here rather than only in the generated project,
    # which XcodeGen overwrites every time the spec is regenerated.
    DEVELOPMENT_TEAM: V7BMDJS5C7
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode 16+ splits a Debug build into a stub executable plus a
    # <target>.debug.dylib, so SwiftUI Previews can swap code without relinking.
    # The share extension does not survive it: installed with devicectl rather
    # than run under Xcode's debugger, the appex never launches, and iOS opens
    # the containing app instead -- no confirmation sheet, nothing saved.
    # Verified 2026-09-03 in the simulator: the same commit shares fine in
    # Release and silently opens the app in Debug. Every install here goes
    # through devicectl or TestFlight, never through Previews, so this costs
    # nothing and makes a sideloaded Debug build behave like the shipped one.
    ENABLE_DEBUG_DYLIB: NO

targets:
  Podcapp:
    type: application
    platform: iOS
    sources:
      - path: Podcapp
    # UIAppFonts is an array, and INFOPLIST_KEY_* build settings only carry
    # scalars, so the app target needs a real plist. Xcode still merges the
    # generated keys below into it.
    info:
      path: Podcapp/Info.plist
      properties:
        # A podcast player that stops when the screen locks fails App Review
        # on completeness alone. Also what lets the lock screen show the episode.
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - InterTight-Light.ttf
          - InterTight-Regular.ttf
          - InterTight-SemiBold.ttf
        # XcodeGen would otherwise hardcode 1.0 (1) here and only the build
        # settings would carry the truth. TestFlight refuses a build number it
        # has already seen, so the two must not be able to drift.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # HTTPS only, which is exempt: answering here means App Store Connect
        # never stops an upload to ask the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisguichard.podcapp
        # iPhone only, and it has to be set PER TARGET: XcodeGen's own setting
        # presets write "1,2" at target level, which beats anything here at
        # project level. Left universal, App Review holds a portrait-only app
        # drawn on 393x852 artboards to the iPad rules: every orientation
        # supported, iPad screenshots in the listing.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Podcapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    # Signature de developpement, cible par cible.
    #
    # Le portail Apple ne contenait AUCUN profil : la signature automatique
    # fabriquait alors un profil `LocalProvision` de repli -- le mecanisme des
    # equipes gratuites, valable 7 jours. L'app tournait avec, l'extension de
    # partage se faisait refuser au lancement par iOS, sans rapport de plantage :
    # la feuille s'ouvrait vide et se refermait, rien n'etait enregistre, depuis
    # toutes les apps sources. Diagnostique le 2026-09-03 en constatant qu'un
    # fichier ecrit des la premiere ligne de viewDidLoad n'existait jamais.
    #
    # Les profils « Podcapp Dev » et « Podcapp Share Dev » ont ete crees sur le
    # portail (API App Store Connect) et sont valables jusqu'au 2027-09-03. La
    # signature automatique les IGNORE et refabrique son profil local, d'ou le
    # passage en manuel -- mais sur Debug uniquement : Release doit rester en
    # automatique pour que `testflight.sh` archive avec les profils de
    # distribution.
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "Podcapp Dev"
    # XcodeGen writes this file itself (and points CODE_SIGN_ENTITLEMENTS at
    # it), so the App Group and Sign in with Apple capabilities live here, not
    # in a hand-edited plist that the next `generate` would overwrite anyway.
    entitlements:
      path: Podcapp/Podcapp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.louisguichard.podcapp
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - target: ShareExtension
        embed: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Podcapp/Shared.swift
      - path: Podcapp/Feedback.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Podcapp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # A predicate, not the dictionary form. The dictionary means "these
            # attachment types and no others": iOS hides the extension as soon
            # as a share carries something undeclared -- a preview image beside
            # the link, which is exactly what Threads attaches. Not a single
            # Threads link ever reached the server, because the share sheet
            # never offered Podcapp at all.
            #
            # This activates whenever ANY attachment is a URL or text and
            # ignores whatever else rides along. Strictly more permissive than
            # what it replaces: it can only make the extension appear in more
            # places, never fewer.
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $att, ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" || ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text").@count >= 1).@count == 1'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisguichard.podcapp.share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "Podcapp Share Dev"
