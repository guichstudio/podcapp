<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Podcapp — social card</title>
<link rel="stylesheet" href="../site.css">
<style>
/* The og-card borrows site.css for the fonts and the tokens, then overrides the
   page chrome: this document is never served, it is only screenshotted at
   1200x630 by make-og.sh. */
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  background: linear-gradient(135deg, #f3effc 0%, #eae5f8 45%, #dbd3f1 100%);
  background-attachment: scroll;
}
.og-card {
  position: relative; width: 1200px; height: 630px; overflow: hidden;
  display: flex; align-items: center; gap: 60px; padding: 0 76px;
}
.og-glow { position: absolute; border-radius: 100%; pointer-events: none; }
.og-glow-a { width: 700px; height: 700px; top: -280px; left: -200px;
  background: radial-gradient(circle, rgba(124,108,220,.42), rgba(124,108,220,0) 70%); }
.og-glow-b { width: 760px; height: 760px; bottom: -380px; right: -220px;
  background: radial-gradient(circle, rgba(96,150,255,.34), rgba(96,150,255,0) 70%); }

.og-copy { position: relative; flex: 1 1 auto; display: flex; flex-direction: column; gap: 24px; }
.og-brand { display: flex; align-items: center; gap: 13px; }
.og-brand img { width: 46px; height: 46px; border-radius: 13px;
  box-shadow: 0 0 0 1px rgba(28,27,34,.08), 0 8px 20px rgba(50,42,110,.16); }
.og-brand span { font-size: 25px; font-weight: 700; letter-spacing: -.015em; }
.og-brand em { font-style: normal; font-size: 11.5px; font-weight: 700; letter-spacing: .09em;
  color: var(--violet); background: rgba(124,108,220,.14);
  border: 1px solid rgba(124,108,220,.26); border-radius: 100px; padding: 7px 14px; margin-left: 6px; }

h1 { font-size: 82px; line-height: 1.02; font-weight: 700; letter-spacing: -.035em; }
h1 .accent { color: var(--violet); }
.og-lede { font-size: 24px; line-height: 1.45; font-weight: 300; color: var(--ink-2); max-width: 620px; }
.og-lede strong { font-weight: 600; color: var(--ink); }
.og-host {
  margin-top: 6px;
  font-size: 19px; font-weight: 700; color: var(--ink-4); letter-spacing: -.01em;
}

/* Right panel: the og-proof, which is the product's whole claim. Shapes stay
   large because this image is usually seen as a thumbnail. */
.og-proof { position: relative; flex: none; width: 352px;
  background: rgba(255,255,255,.58); border: 1px solid rgba(255,255,255,.75);
  border-radius: 28px; padding: 38px 32px; box-shadow: 0 24px 60px rgba(50,42,110,.16);
  display: flex; flex-direction: column; gap: 26px; }
.og-proof-head { font-size: 12px; font-weight: 700; letter-spacing: .09em; color: var(--ink-4); }
.og-row { display: flex; align-items: center; gap: 13px; font-size: 19px; font-weight: 500; color: var(--ink-2); }
.og-row b { font-weight: 700; color: var(--ink); }
.og-dot { width: 26px; height: 26px; border-radius: 100px; flex: none;
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
  background: rgba(46,125,70,.15); color: var(--green); }
.og-dot.v { background: rgba(124,108,220,.16); color: var(--violet); }
.og-rule { height: 1px; background: rgba(28,27,34,.09); }
.og-foot { font-size: 15px; font-weight: 500; color: var(--ink-4); line-height: 1.35; }
</style>
</head>
<body>
<div class="og-card">
  <span class="og-glow og-glow-a"></span>
  <span class="og-glow og-glow-b"></span>

  <div class="og-copy">
    <div class="og-brand">
      <img src="../logo.png" alt="">
      <span>Podcapp</span>
      <em data-i18n="eyebrow">EVERY MORNING</em>
    </div>
    <h1 data-i18n="h1">Your morning<br><span class="accent">recap.</span></h1>
    <p class="og-lede" data-i18n="lede">Everything you saved and never got to <strong>read</strong>, told back to you as audio.</p>
      <p class="og-host">podcapp.fr</p>
  </div>

  <div class="og-proof">
    <span class="og-proof-head" data-i18n="proofHead">ON EVERY EPISODE</span>
    <div class="og-row"><span class="og-dot">✓</span><span data-i18n="p1">Every sentence <b>sourced</b></span></div>
    <div class="og-rule"></div>
    <div class="og-row"><span class="og-dot">✓</span><span data-i18n="p2"><b>0</b> unsourced claims on air</span></div>
    <div class="og-rule"></div>
    <div class="og-row"><span class="og-dot v">↗</span><span data-i18n="p3">The source <b>one tap away</b></span></div>
    <p class="og-foot" data-i18n="foot">A source we couldn't read is named and dropped, never summarised from memory.</p>
  </div>
</div>

<script>
/* One template, two languages: ?lang=fr swaps the strings in place, so the
   two cards can never drift apart in layout. */
var FR = {
  eyebrow: "CHAQUE MATIN",
  h1: 'Votre morning<br><span class="accent">recap.</span>',
  lede: "Tout ce que vous avez gard\u00e9 sans le <strong>lire</strong>, racont\u00e9 en audio.",
  proofHead: "SUR CHAQUE \u00c9PISODE",
  p1: "Chaque phrase <b>sourc\u00e9e</b>",
  p2: "<b>0</b> affirmation non sourc\u00e9e",
  p3: "La source <b>\u00e0 un geste</b>",
  foot: "Une source qu'on n'a pas pu lire est nomm\u00e9e et \u00e9cart\u00e9e, jamais r\u00e9sum\u00e9e de m\u00e9moire."
};
if (location.search.indexOf("lang=fr") !== -1) {
  document.documentElement.lang = "fr";
  for (var k in FR) {
    var el = document.querySelector('[data-i18n="' + k + '"]');
    if (el) el.innerHTML = FR[k];
  }
}
</script>
</body>
</html>
